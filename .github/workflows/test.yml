name: test
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse every script
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
            if ($e) { $bad++; $e | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" } }
          }
          if ($bad) { exit 1 }
      - name: Self-tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $p = Start-Process powershell.exe -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','tests/Run-Tests.ps1' -Wait -PassThru -NoNewWindow
          Write-Host "::notice::self-tests exit code $($p.ExitCode)"
          exit $p.ExitCode
      - name: PNG step exits cleanly
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            $p = Start-Process powershell.exe -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-STA','-File','tests/png-exit.ps1' -Wait -PassThru -NoNewWindow
            Write-Host "::notice::run $i exit code $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { exit 1 }
          }
      - name: Self-tests (PowerShell 7)
        shell: pwsh
        run: ./tests/Run-Tests.ps1
      - name: Live check - fetch resume.io renderer
        continue-on-error: true
        shell: powershell
        run: |
          $env:RESUMEGRABBER_HOME = Join-Path $env:RUNNER_TEMP 'rg'
          . ./lib/Core.ps1
          Initialize-RGDirs
          $n = Get-RGNode -OnStatus { param($m) Write-Host $m }
          Write-Host "node: $n $(& $n --version)"
          $b = Get-RGBundle -OnStatus { param($m) Write-Host $m }
          Write-Host "engine: $($b.Entry)"
          Get-ChildItem $b.Dir | Format-Table Name, Length
