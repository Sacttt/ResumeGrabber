name: test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse every script
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
            if ($e) { $bad++; $e | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" } }
          }
          if ($bad) { exit 1 }
      - name: Self-tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $p = Start-Process powershell.exe -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','tests/Run-Tests.ps1' -Wait -PassThru -NoNewWindow
          Write-Host "::notice::self-tests exit code $($p.ExitCode)"
          exit $p.ExitCode
      - name: PNG step exits cleanly
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            $p = Start-Process powershell.exe -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-STA','-File','tests/png-exit.ps1' -Wait -PassThru -NoNewWindow
            Write-Host "::notice::run $i exit code $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { exit 1 }
          }
      - name: Self-tests (PowerShell 7)
        shell: pwsh
        run: ./tests/Run-Tests.ps1
      - name: Live check - fetch resume.io renderer
        shell: powershell
        run: |
          $env:RESUMEGRABBER_HOME = Join-Path $env:RUNNER_TEMP 'rg'
          . ./lib/Core.ps1
          Initialize-RGDirs
          $n = Get-RGNode -OnStatus { param($m) Write-Host $m }
          Write-Host "node: $n $(& $n --version)"
          $b = Get-RGBundle -OnStatus { param($m) Write-Host $m }
          Write-Host "::notice::engine $($b.Entry), $(@(Get-ChildItem $b.Dir).Count) files, node $(& $n --version)"
          Get-ChildItem $b.Dir | Format-Table Name, Length
      - name: Launch the app, screenshot it, close it, check cleanup
        shell: powershell
        run: |
          $session = Join-Path $env:RUNNER_TEMP 'rg-session'
          $p = Start-Process powershell.exe -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-STA','-File',"`"$PWD\ResumeGrabber.ps1`"",'-SessionDir',"`"$session`"" -PassThru
          Start-Sleep -Seconds 45
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force screens | Out-Null
          $bmp.Save("$PWD\screens\app.png")
          Write-Host "::notice::screen $($b.Width)x$($b.Height); data dir exists while running: $(Test-Path (Join-Path $session 'data'))"
          # Simulate step 3: copy a (made-up) resume document and let the app auto-create the PNG.
          Set-Clipboard -Value '{"id":4242,"renderingToken":"ciTestToken","template":"sydney","locale":"en","firstName":"Jane","lastName":"Doe","jobTitle":"QA Engineer","color":"#1a91f0","sections":[]}'
          Start-Sleep -Seconds 40
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\screens\after.png")
          Get-ChildItem "$env:USERPROFILE\Downloads" -Filter *.png -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "::notice::saved $($_.Name) $($_.Length) bytes"; Copy-Item $_.FullName "$PWD\screens\result.png" }
          $p.Refresh(); Write-Host "::notice::exited early: $($p.HasExited) code $(if ($p.HasExited) { $p.ExitCode })"
          [void]$p.CloseMainWindow()
          if (-not $p.WaitForExit(30000)) { Write-Host '::warning::app did not close, killing'; $p.Kill() }
          Start-Sleep -Seconds 2
          Write-Host "::notice::after close: data dir exists = $(Test-Path (Join-Path $session 'data'))"
      - name: Publish screenshot to ci-screens branch
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path screens/app.png)) { exit 0 }
          Copy-Item screens/*.png $env:RUNNER_TEMP/
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-screens
          git rm -rf -q .
          Copy-Item $env:RUNNER_TEMP/*.png .
          git add *.png; git commit -q -m "screenshot ${{ github.sha }}"
          git push -f origin ci-screens
